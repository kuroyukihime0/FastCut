name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --name=FastCut --windowed --onefile --icon=NONE --add-data "styles.qss;." main.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-Windows
        path: dist/FastCut.exe

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --name=FastCut --windowed --onefile --add-data "styles.qss:." main.py
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-macOS
        path: dist/FastCut

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-Windows
        path: ./windows
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-macOS
        path: ./macos
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./windows/FastCut.exe
          ./macos/FastCut
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
