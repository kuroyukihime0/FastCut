name: Build Executables

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build Lite (No FFmpeg)
      run: |
        pyinstaller --name=FastCut-Lite --windowed --onefile --icon=assets/logo.ico --add-data "styles.qss;." --add-data "assets;assets" main.py

    - name: Build Full (With FFmpeg)
      run: |
        pyinstaller --name=FastCut-Full --windowed --onefile --icon=assets/logo.ico --add-data "styles.qss;." --add-data "assets;assets" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" main.py
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-Windows
        path: |
          dist/FastCut-Lite.exe
          dist/FastCut-Full.exe

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build Lite (No FFmpeg)
      run: |
        pyinstaller --name=FastCut-Lite --windowed --onefile --add-data "styles.qss:." --add-data "assets:assets" main.py

    - name: Build Full (With FFmpeg)
      run: |
        pyinstaller --name=FastCut-Full --windowed --onefile --add-data "styles.qss:." --add-data "assets:assets" --add-binary "bin/ffmpeg_osx:bin" --add-binary "bin/ffprobe_osx:bin" main.py
    
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-macOS
        path: |
          dist/FastCut-Lite
          dist/FastCut-Full

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Generate Changelog
      id: changelog
      shell: bash
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LATEST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s")
        else
          CHANGELOG=$(git log "$LATEST_TAG"..HEAD --pretty=format:"- %s")
        fi
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "changelog<<$EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Get current date and time
      id: date
      run: echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-Windows
        path: ./windows
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-macOS
        path: ./macos

    - name: Rename Artifacts
      run: |
        TIMESTAMP="${{ steps.date.outputs.timestamp }}"
        mv ./windows/FastCut-Lite.exe "./windows/FastCut-${TIMESTAMP}.exe"
        mv ./windows/FastCut-Full.exe "./windows/FastCut-ffmpeg-embed-${TIMESTAMP}.exe"
        mv ./macos/FastCut-Lite "./macos/FastCut-${TIMESTAMP}-osx"
        mv ./macos/FastCut-Full "./macos/FastCut-ffmpeg-embed-${TIMESTAMP}-osx"
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.date.outputs.timestamp }}
        name: Release ${{ steps.date.outputs.timestamp }}
        body: |
          Automated build from commit ${{ github.sha }}
          
          ## Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ## Downloads
          
          ### Windows
          - **Full Version (Recommended)**: `FastCut-ffmpeg-embed-${{ steps.date.outputs.timestamp }}.exe`
            - *Includes FFmpeg. No setup required.*
          - **Lite Version**: `FastCut-${{ steps.date.outputs.timestamp }}.exe`
            - *Requires system FFmpeg.*
          
          ### macOS
          - **Full Version (Recommended)**: `FastCut-ffmpeg-embed-${{ steps.date.outputs.timestamp }}-osx`
            - *Includes FFmpeg. No setup required.*
          - **Lite Version**: `FastCut-${{ steps.date.outputs.timestamp }}-osx`
            - *Requires system FFmpeg.*
          
          ## Notes
          - If you use the **Lite Version**, ensure FFmpeg is installed and in your system PATH.
        files: |
          ./windows/FastCut-ffmpeg-embed-${{ steps.date.outputs.timestamp }}.exe
          ./windows/FastCut-${{ steps.date.outputs.timestamp }}.exe
          ./macos/FastCut-ffmpeg-embed-${{ steps.date.outputs.timestamp }}-osx
          ./macos/FastCut-${{ steps.date.outputs.timestamp }}-osx
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
