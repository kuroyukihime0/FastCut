name: Build Executables

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --name=FastCut --windowed --onefile --icon=assets/logo.ico --add-data "styles.qss;." --add-data "assets;assets" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" main.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-Windows
        path: dist/FastCut.exe

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6
        pip install pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --name=FastCut --windowed --onefile --add-data "styles.qss:." --add-data "assets:assets" --add-binary "bin/ffmpeg_osx:bin" --add-binary "bin/ffprobe_osx:bin" main.py
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: FastCut-macOS
        path: dist/FastCut

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Generate Changelog
      id: changelog
      shell: bash
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$LATEST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s")
        else
          CHANGELOG=$(git log "$LATEST_TAG"..HEAD --pretty=format:"- %s")
        fi
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "changelog<<$EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT

    - name: Get current date and time
      id: date
      run: echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT
    
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-Windows
        path: ./windows
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: FastCut-macOS
        path: ./macos
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.date.outputs.timestamp }}
        name: Release ${{ steps.date.outputs.timestamp }}
        body: |
          Automated build from commit ${{ github.sha }}
          
          ## Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ## Downloads
          - **Windows**: FastCut.exe
          - **macOS**: FastCut
          
          ## Requirements
          - FFmpeg must be installed and available in system PATH
        files: |
          ./windows/FastCut.exe
          ./macos/FastCut
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
